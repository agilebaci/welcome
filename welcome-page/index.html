<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Coming Soon - Agile Bacı</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Background and main content styling */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #E2F0F3;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 3rem;
            color: #B57F3B; /* Text color from the mascot's robe */
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 25px;
        }

        .email-input {
            padding: 12px;
            width: 80%;
            max-width: 350px;
            font-size: 1rem;
            border: 2px solid #FFD700; 
            border-radius: 5px;
            margin-bottom: 25px;
            color: #333;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            color: white;
            background-color: #00C6A5; 
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #008D77; 
        }

        .mascot {
            margin: 20px 0;
            width: 350px;
            height: auto;
            border-radius: 50%;
        }

        /* Footer Section */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agile Bacı</h1>
        <p>Something awesome is coming soon! Stay tuned for updates.</p>

        <!-- Mascot Image -->
        <img src="agile-baci.png" alt="Agile Bacı" class="mascot">

        <form>
            <input type="email" class="email-input" placeholder="Enter your email" required>
            <br>
            <button type="submit" class="btn">Notify Me</button>
        </form>

    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; <span id="current-year"></span> Agile Bacı. All Rights Reserved.
    </div>

    <script>
        // Set the current year dynamically
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
